<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusCrave — Code With AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SYSTEM A — "Canteen at Night" (the player). VISUALS.md §A
   ============================================================ */
:root{
  --night:#171210;      /* canteen after hours */
  --smoke:#241C18;      /* card surface */
  --pit:#0D0A08;        /* recessed surface: feeds, slates, code */
  --edge:#322822;       /* hairline on pit */
  --edge2:#3A2F28;      /* hairline on smoke */
  --sodium:#FFB238;     /* sodium-lamp amber — warnings, emphasis */
  --sodium-dk:#7A5518;
  --chili:#E8452E;      /* tension, errors, passenger moves */
  --chutney:#7FC97F;    /* success, pilot moves */
  --steel:#C9C2BB;      /* body text */
  --faint:#8A7F76;      /* muted */
  --bright:#F3EDE7;     /* headings */
  --display:'Anton',sans-serif;
  --body:'Instrument Sans',sans-serif;
  --mono:'JetBrains Mono',monospace;

  /* SYSTEM B — "Canteen at Lunch" (app stills only). VISUALS.md §B */
  --milk:#FFFDF7; --ink:#1C1A17; --curry:#14532D; --marigold:#FFAF2E;
  --marigold-dk:#B87510; --leaf:#2E9E5B; --card:#FFF; --line:#EDE6D8;
  --appdisp:'Bricolage Grotesque',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--night);color:var(--steel);font-family:var(--body);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--sodium)}
:focus-visible{outline:2px solid var(--sodium);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- film-strip progress ---------- */
#strip{position:fixed;top:0;left:0;height:4px;background:var(--sodium);width:0%;z-index:99;transition:width .15s linear}

/* ---------- top bar + episode index ---------- */
#bar{position:fixed;top:4px;left:0;right:0;z-index:98;background:rgba(23,18,16,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--edge)}
#barin{max-width:1000px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:14px}
#logo{font-family:var(--display);text-transform:uppercase;color:var(--bright);font-size:16px;letter-spacing:.02em;background:none;border:0;cursor:pointer;padding:0}
#logo span{color:var(--sodium)}
#now{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barbtn{margin-left:auto;background:none;border:1px solid var(--edge2);color:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.barbtn+.barbtn{margin-left:8px}
.barbtn:hover{color:var(--sodium);border-color:var(--sodium)}

/* ---------- index (film strip of 44 frames) ---------- */
#index{position:fixed;inset:0;z-index:100;background:rgba(13,10,8,.97);overflow-y:auto;display:none;padding:80px 0 60px}
#index.show{display:block}
#index .wrap{max-width:1000px}
.trackblock{margin-bottom:34px}
.trackhead{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--sodium);margin-bottom:4px}
.tracksub{font-size:13.5px;color:var(--faint);margin-bottom:14px}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:10px}
.frame{position:relative;text-align:left;background:var(--smoke);border:1px solid var(--edge2);border-radius:10px;padding:13px 14px 14px;cursor:pointer;color:var(--steel);font-family:var(--body);transition:border-color .18s,transform .12s}
.frame::before,.frame::after{content:"";position:absolute;left:6px;right:6px;height:5px;background-image:radial-gradient(circle,var(--pit) 1.6px,transparent 1.7px);background-size:11px 5px}
.frame::before{top:3px} .frame::after{bottom:3px}
.frame:hover:not(:disabled){border-color:var(--sodium);transform:translateY(-2px)}
.frame:disabled{cursor:not-allowed;opacity:.42}
.frame .n{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--sodium)}
.frame .t{display:block;color:var(--bright);font-size:14px;font-weight:600;line-height:1.3;margin-top:6px}
.frame .s{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:7px;letter-spacing:.1em;text-transform:uppercase}
.frame.seen{border-color:#4A5F4A}
.frame.seen .s{color:var(--chutney)}

/* ---------- layout ---------- */
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
section{padding:68px 0}
hr.cut{border:0;height:1px;background:linear-gradient(90deg,transparent,var(--edge2),transparent)}
.slate{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:18px}
.slate b{color:var(--sodium);font-weight:700}
.beat{font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:var(--sodium);text-transform:uppercase;margin-bottom:14px}
h1{font-family:var(--display);font-weight:400;color:var(--bright);font-size:clamp(40px,10vw,72px);line-height:1.02;text-transform:uppercase;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--sodium)}
h2{font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--bright);font-size:clamp(28px,6.4vw,42px);line-height:1.08;margin-bottom:18px}
h3{font-family:var(--body);font-weight:600;color:var(--bright);font-size:17px;margin-bottom:8px}
p{margin-bottom:16px;font-size:16.5px}
p:last-child{margin-bottom:0}
p.big{font-size:19px;color:#E8E1DA}
.sub{margin-top:16px;font-size:16px;color:var(--steel);max-width:46ch}
code,.mono{font-family:var(--mono);font-size:.92em;color:var(--sodium)}
strong{color:var(--bright);font-weight:600}
ul.pts{list-style:none;margin:0 0 16px}
ul.pts li{position:relative;padding-left:20px;margin-bottom:9px;font-size:16.5px}
ul.pts li::before{content:"▸";position:absolute;left:0;color:var(--sodium)}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

.quote{border-left:3px solid var(--sodium);padding:6px 0 6px 18px;margin:26px 0;color:#E8E1DA;font-size:18px}
.quote .who{display:block;margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.12em}
.codeblock{font-family:var(--mono);font-size:13.5px;background:var(--pit);border:1px solid var(--edge);border-radius:10px;padding:16px 18px;line-height:2;margin-bottom:16px;overflow-x:auto}
.codeblock .c{color:var(--faint)}
.codeblock .o{color:var(--chutney)}
.codeblock .e{color:var(--chili)}
.callout{background:var(--pit);border:1px solid var(--edge);border-left:3px solid var(--sodium);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.callout.good{border-left-color:var(--chutney)}
.callout.bad{border-left-color:var(--chili)}
.callout .tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sodium);margin-bottom:8px}
.callout.good .tag{color:var(--chutney)} .callout.bad .tag{color:var(--chili)}

/* ---------- cold open ---------- */
#coldopen{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:80px 0 40px}
.feedbox{background:var(--pit);border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.feedhead{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:10px 14px;border-bottom:1px solid var(--edge);font-family:var(--mono);font-size:11px;color:var(--faint)}
/* the source line yields first; the status label must never be crowded or clipped */
.feedhead>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.feedhead .live{color:var(--chutney);flex:none;white-space:nowrap}
.feedhead .live.err{color:var(--chili)}
.feed{height:264px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.9;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .ok{color:#9FB59F}.feed .ok b{color:var(--chutney);font-weight:400}
.feed .err{color:var(--chili)}
.feed .warn{color:var(--sodium)}
.feed .typed{color:var(--steel)}
.feed .ghost{color:var(--faint);font-style:italic}
.counterwrap{margin-top:22px;font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:opacity .6s}
.counterwrap.show{opacity:1}
.counterwrap .num{font-family:var(--display);font-size:clamp(56px,16vw,96px);color:var(--chili);line-height:1;letter-spacing:.02em}
#titlecard{opacity:0;transform:translateY(14px);transition:opacity .8s,transform .8s;margin-top:34px}
#titlecard.show{opacity:1;transform:none}
.ep{font-family:var(--mono);color:var(--sodium);font-size:13px;letter-spacing:.3em;margin-bottom:10px}
#skip{margin-top:26px;align-self:flex-start;background:none;border:1px solid var(--edge2);color:var(--faint);font-family:var(--mono);font-size:12px;padding:10px 16px;border-radius:999px;cursor:pointer}
#skip:hover{color:var(--sodium);border-color:var(--sodium)}

/* ---------- your move ---------- */
.choice{display:block;width:100%;text-align:left;background:var(--smoke);border:1px solid var(--edge2);border-radius:12px;padding:16px 18px;margin-bottom:12px;color:var(--steel);font-family:var(--body);font-size:15.5px;cursor:pointer;transition:border-color .2s,transform .12s}
.choice b{color:var(--bright);display:block;margin-bottom:2px;font-size:16px}
.choice:hover:not(:disabled){border-color:var(--sodium);transform:translateY(-1px)}
.choice.picked-bad{border-color:var(--chili)}
.choice.picked-good{border-color:var(--chutney)}
.choice:disabled{cursor:default;opacity:.5}
.choice:disabled.picked-bad,.choice:disabled.picked-good{opacity:1}
.verdict{display:none;margin-top:8px;background:var(--pit);border:1px solid var(--edge);border-radius:12px;padding:18px}
.verdict.show{display:block;animation:pop .35s ease}
.verdict .tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
.verdict.good .tag{color:var(--chutney)} .verdict.bad .tag{color:var(--chili)}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

/* ---------- lab card ---------- */
.lab{background:var(--smoke);border:1px solid var(--edge2);border-radius:14px;padding:22px;margin-top:24px}
.lab .goal{font-size:17.5px;color:#E8E1DA;margin-bottom:18px}
.labsec{margin-bottom:18px}
.labsec .h{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.paths{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pathbtn{background:var(--pit);border:1px solid var(--edge);color:var(--steel);font-family:var(--mono);font-size:12px;padding:9px 14px;border-radius:999px;cursor:pointer}
.pathbtn[aria-selected="true"]{border-color:var(--sodium);color:var(--sodium);background:#1E1611}
.pathpane{display:none}
.pathpane.on{display:block}
.pathpane ol{margin:0 0 0 20px}
.pathpane li{margin-bottom:9px;font-size:15.5px}
.verify{border-left:3px solid var(--chutney);padding-left:16px;margin-top:18px}
.verify .h{color:var(--chutney)}

/* ---------- transferable idea + checkpoint ---------- */
.transfer{border:1px solid var(--sodium);border-radius:14px;padding:20px;margin-top:26px;background:linear-gradient(180deg,#1E1611,var(--smoke))}
.transfer .tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sodium);margin-bottom:10px}
.checkpoint{border:1px dashed var(--chutney);border-radius:14px;padding:20px;margin-top:26px}
.checkpoint .tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--chutney);margin-bottom:10px}

/* ---------- cliffhanger ---------- */
#cliff{background:linear-gradient(180deg,var(--night) 0%,var(--pit) 100%);padding-bottom:110px}
.next{font-family:var(--mono);color:var(--chili);font-size:12px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:12px}
#cliff h2{font-size:clamp(34px,8vw,56px)}
.timer{font-family:var(--mono);color:var(--sodium);font-size:13px;margin-top:20px}
.ticket{margin-top:30px;display:inline-block;background:var(--sodium);color:var(--night);font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.08em;padding:14px 22px;border-radius:6px;text-decoration:none;box-shadow:4px 4px 0 var(--sodium-dk);border:0;cursor:pointer}
.ticket:hover{transform:translate(1px,1px);box-shadow:3px 3px 0 var(--sodium-dk)}
.ticket:disabled{opacity:.4;cursor:not-allowed;box-shadow:4px 4px 0 var(--sodium-dk);transform:none}

/* ---------- checklist (orientation) ---------- */
.check{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--smoke);border:1px solid var(--edge2);border-radius:14px;padding:16px 18px;margin-bottom:12px;cursor:pointer;color:var(--steel);font-family:var(--body);transition:border-color .2s}
.check:hover{border-color:var(--sodium)}
.check.done{border-color:var(--chutney)}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--faint);margin-top:2px;display:flex;align-items:center;justify-content:center;color:var(--night);font-weight:700;font-size:14px}
.check.done .box{background:var(--chutney);border-color:var(--chutney)}
.check b{color:var(--bright);display:block;font-size:15.5px}
.check small{font-size:13.5px;color:var(--steel);display:block}
.tally{font-family:var(--mono);font-size:13px;color:var(--faint);margin:6px 0 18px}
.tally b{color:var(--sodium)}
.readycard{display:none;margin-top:22px;border:1px solid var(--chutney);border-radius:14px;padding:20px;background:var(--pit)}
.readycard.show{display:block;animation:pop .35s ease}

/* ---------- architecture diagram ---------- */
.arch{background:var(--pit);border:1px solid var(--edge);border-radius:12px;padding:18px;font-family:var(--mono);font-size:12.5px;line-height:2;color:var(--steel);overflow-x:auto;white-space:pre;margin-bottom:16px}
.arch b{color:var(--sodium);font-weight:700}
.arch i{color:var(--chutney);font-style:normal}

/* ============================================================
   APP STILLS — SYSTEM B framed inside SYSTEM A. VISUALS.md §B/C
   "night player showing the daytime app"
   ============================================================ */
.journey{display:grid;grid-template-columns:1fr;gap:26px;margin-top:26px}
@media(min-width:640px){.journey{grid-template-columns:1fr 1fr}}
.stepno{font-family:var(--mono);font-size:11px;color:var(--night);background:var(--sodium);display:inline-block;padding:4px 10px;border-radius:999px;font-weight:700;letter-spacing:.12em;margin-bottom:10px}
.caption{margin-top:10px;font-size:14px;color:var(--steel)}
.caption b{color:var(--bright)}
.still{background:var(--milk);color:var(--ink);border-radius:18px;padding:16px;box-shadow:0 8px 26px rgba(0,0,0,.5);font-family:var(--body);line-height:1.5}
.still .brand{font-family:var(--appdisp);font-weight:800;font-size:15px;color:var(--curry)}
.still .brand span{color:var(--marigold-dk)}
.mini{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.mini .em{font-size:24px;flex:none;line-height:1}
.mini b{font-size:13px;display:block}
.mini small{font-size:11.5px;color:#8A8272}
.mini .add{margin-left:auto;font-size:11px;font-weight:700;border:1.5px solid var(--marigold);color:var(--marigold-dk);border-radius:8px;padding:5px 10px;flex:none}
.vn{display:inline-block;width:10px;height:10px;border-radius:2px;border:1.4px solid var(--leaf);position:relative;margin-right:4px}
.vn.nonveg{border-color:var(--chili)}
.vn::after{content:"";position:absolute;inset:1.8px;border-radius:50%;background:var(--leaf)}
.vn.nonveg::after{background:var(--chili)}
.cartline{margin-top:10px;background:var(--curry);color:#F4F9F1;border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:10px;font-size:12px}
.tok{width:30px;height:30px;border-radius:50%;background:var(--marigold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:11px;border:2px dashed rgba(28,26,23,.35);flex:none}
.cta{margin-left:auto;background:#F4F9F1;color:var(--curry);border-radius:8px;padding:5px 9px;font-weight:700;flex:none}
.tl{margin-top:10px}
.tl .row{display:flex;gap:10px;align-items:center;font-size:12.5px;padding:5px 0}
.tl .d{width:12px;height:12px;border-radius:50%;flex:none}
.d.done{background:var(--leaf)}
.d.now{background:var(--marigold);box-shadow:0 0 0 4px rgba(255,175,46,.25)}
.d.wait{background:var(--line)}
.rushrow{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12px}
.rd{width:8px;height:8px;border-radius:50%;background:var(--chili);flex:none}
.rushrow .eta{margin-left:auto;font-family:var(--mono);color:var(--chili);font-weight:700}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none;transition:none}
  #titlecard,.counterwrap{transition:none}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<div id="strip" aria-hidden="true"></div>

<header id="bar">
  <div id="barin">
    <button id="logo" aria-label="CampusCrave — open episode index">Campus<span>Crave</span></button>
    <div id="now" aria-live="polite"></div>
    <button class="barbtn" id="btnIndex">episodes</button>
    <button class="barbtn" id="btnSave" title="Export progress as JSON">save</button>
    <button class="barbtn" id="btnLoad" title="Import progress JSON">load</button>
  </div>
</header>

<nav id="index" aria-label="Episode index" aria-hidden="true"><div class="wrap">
  <h2 style="margin-bottom:6px">The season</h2>
  <p style="color:var(--faint);margin-bottom:30px">44 episodes across 8 tracks. Dim frames are still in production.</p>
  <div id="frames"></div>
  <button class="barbtn" id="btnClose" style="margin:0">← back to the episode</button>
</div></nav>

<main id="stage"></main>

<input type="file" id="fileIn" accept="application/json" class="sr" aria-hidden="true">

<script>
/* ============================================================
   EPISODES — authored one per session. Injected by
   scripts/inject_episode.py. Never hand-edit inside the markers.
   ============================================================ */
const EPISODES = [
/* <<< EPISODES:START >>> */
/* --- ep00:START --- */
{
  "id": "ep00",
  "num": 0,
  "kind": "orientation",

  "parts": [
    {
      "label": "Part 1 · The app, in four stills",
      "heading": "One order, start to finish",
      "body": [
        {
          "t": "stills",
          "items": [
            {
              "step": "STILL 1 · BROWSE",
              "screen": [
                {
                  "t": "brand",
                  "html": "Campus<span>Crave</span>"
                },
                {
                  "t": "rush",
                  "text": "Lunch rush is ON",
                  "eta": "~12 min"
                },
                {
                  "t": "dish",
                  "emoji": "🍚",
                  "name": "Hyderabadi Biryani",
                  "note": "🔥 Only 3 left · Wed special",
                  "veg": false,
                  "add": true
                },
                {
                  "t": "dish",
                  "emoji": "🥞",
                  "name": "Masala Dosa",
                  "note": "bestseller · 8 min",
                  "veg": true,
                  "add": true
                }
              ],
              "caption": "<b>The menu.</b> Live rush meter, veg/non-veg marks, stock counts. Served by the React app (<span class=\"mono\">campuscrave-web</span>)."
            },
            {
              "step": "STILL 2 · ORDER",
              "screen": [
                {
                  "t": "brand",
                  "html": "Your cart"
                },
                {
                  "t": "dish",
                  "emoji": "🍚",
                  "name": "Hyderabadi Biryani ×1",
                  "note": "₹90 · pickup Block C",
                  "add": false
                },
                {
                  "t": "cart",
                  "token": "#48",
                  "html": "<b>Token #48</b> · wallet pays ₹90",
                  "cta": "Place order →"
                }
              ],
              "caption": "<b>The token.</b> Placing an order mints your canteen token. Behind this button: a POST to the Spring Boot API — stock check, wallet debit, order row. (Episode 1's crash lives right here.)"
            },
            {

    let n = d.startOrder, timers = [];
    const line = (html, cls) => {
      const el = document.createElement('div');
      el.className = cls; el.innerHTML = html; feed.appendChild(el);
      while (feed.children.length > 11) feed.removeChild(feed.firstChild);
    };
    const ok = () => line(`<b>✓</b> #${++n} · ${d.dishes[n % d.dishes.length]} · paid ₹${d.prices[n % d.prices.length]}`, 'ok');
    const finale = () => {
      live.textContent = d.downLabel; live.classList.add('err');
      cw.classList.add('show'); $('#titlecard').classList.add('show');
      $('#skip').style.display = 'none';
      if (reduce) { num.textContent = d.count; return; }
      let cur = 0; const c = setInterval(() => {
        cur += Math.ceil(d.count / 21);
        if (cur >= d.count) { cur = d.count; clearInterval(c); }
        num.textContent = cur;
      }, 40);
    };
    const skip = () => {
      timers.forEach(clearTimeout); feed.innerHTML = '';
      d.script.filter(s => s[2] === 'keep').forEach(s => line(s[1].replace('{n}', n), s[3] || 'err'));
      finale();
    };
    root.querySelector('#skip').onclick = skip;
    if (reduce) { skip(); return; }
    let t = 0;
    for (let i = 0; i < d.okBeats.length; i++) timers.push(setTimeout(ok, d.okBeats[i]));
    d.script.forEach(([delay, html, , cls]) =>
      timers.push(setTimeout(() => line(html.replace('{n}', n), cls || 'err'), delay)));
    timers.push(setTimeout(finale, d.finaleAt));
    return () => timers.forEach(clearTimeout);
  },

  /* diff replay: generated code streams in green, then the audit frame
     strikes through the lines that call code which does not exist */
  diffReveal(root, d){
    const feed = root.querySelector('.feed'), live = root.querySelector('.live');
    const cw = root.querySelector('.counterwrap'), num = root.querySelector('.num');
    let timers = [];
    const line = (html, cls) => {
      const el = document.createElement('div');
      el.className = cls || 'ok'; el.innerHTML = html; feed.appendChild(el);
      while (feed.children.length > 11) feed.removeChild(feed.firstChild);
    };
    const finale = () => {
      live.textContent = d.downLabel; live.classList.add('err');
      cw.classList.add('show'); $('#titlecard').classList.add('show');
      $('#skip').style.display = 'none';
      if (reduce) { num.textContent = d.count; return; }
      let cur = 0; const c = setInterval(() => {
        cur += Math.max(1, Math.ceil(d.count / 21));
        if (cur >= d.count) { cur = d.count; clearInterval(c); }
        num.textContent = cur;
      }, 70);
    };
    const audit = () => {
      feed.innerHTML = '';
      d.audit.forEach(([html, cls], i) =>
        timers.push(setTimeout(() => line(html, cls || 'err'), i * d.auditStep)));
    };
    const skip = () => {
      timers.forEach(clearTimeout); feed.innerHTML = '';
      d.audit.forEach(([html, cls]) => line(html, cls || 'err'));
      finale();
    };
    root.querySelector('#skip').onclick = skip;
    if (reduce) { skip(); return; }
    d.intro.forEach(([delay, html, cls]) =>
      timers.push(setTimeout(() => line(html, cls), delay)));
    d.stream.forEach((text, i) =>
      timers.push(setTimeout(() => line(text, 'ok'), d.streamStart + i * d.streamStep)));
    timers.push(setTimeout(audit, d.auditAt));
    timers.push(setTimeout(finale, d.finaleAt));
    return () => timers.forEach(clearTimeout);
  },

  /* editor pane: code is typed, ghost text appears faint, Tab makes it real,
     then the audit frame shows what shipped */
  ghostType(root, d){
    const feed = root.querySelector('.feed'), live = root.querySelector('.live');
    const cw = root.querySelector('.counterwrap'), num = root.querySelector('.num');
    let timers = [];
    const line = (html, cls) => {
      const el = document.createElement('div');
      el.className = cls || 'typed'; el.innerHTML = html; feed.appendChild(el);
      while (feed.children.length > 11) feed.removeChild(feed.firstChild);
      return el;
    };
    const finale = () => {
      live.textContent = d.downLabel; live.classList.add('err');
      cw.classList.add('show'); $('#titlecard').classList.add('show');
      $('#skip').style.display = 'none';
      if (reduce) { num.textContent = d.count; return; }
      let cur = 0; const c = setInterval(() => {
        cur += Math.max(1, Math.ceil(d.count / 21));
        if (cur >= d.count) { cur = d.count; clearInterval(c); }
        num.textContent = cur;
      }, 70);
    };
    const audit = () => {
      feed.innerHTML = '';
      d.audit.forEach(([html, cls], i) =>
        timers.push(setTimeout(() => line(html, cls || 'err'), i * d.auditStep)));
    };
    const skip = () => {
      timers.forEach(clearTimeout); feed.innerHTML = '';
      d.audit.forEach(([html, cls]) => line(html, cls || 'err'));
      finale();
    };
    root.querySelector('#skip').onclick = skip;
    if (reduce) { skip(); return; }
    d.script.forEach(([delay, action, html, cls]) => timers.push(setTimeout(() => {
      if (action === 'tab') {
        const ghosts = feed.querySelectorAll('.ghost');
        const ghost = ghosts[ghosts.length - 1];
        if (ghost) { ghost.className = 'ok'; ghost.innerHTML = html; }
      } else {
        line(html, action === 'ghost' ? 'ghost' : cls);
      }
    }, delay)));
    timers.push(setTimeout(audit, d.auditAt));
    timers.push(setTimeout(finale, d.finaleAt));
    return () => timers.forEach(clearTimeout);
  }
};

/* ============================================================
   RENDER
   ============================================================ */
let teardown = null;

function render(id){
  if (teardown) { teardown(); teardown = null; }
  if (id === 'capstone') return renderCapstone();
  const ep = byId(id); if (!ep) return renderMissing(id);
  state.seen[id] = true;
  location.hash = id;
  $('#now').textContent = `EP${String(ep.num).padStart(2,'0')} · ${ep.title}`;
  document.title = `EP.${String(ep.num).padStart(2,'0')} — ${ep.title} · CampusCrave`;
  $('#stage').innerHTML = ep.kind === 'orientation' ? orientationHTML(ep) : episodeHTML(ep);
  wire(ep);
  scrollTo(0, 0);
  observeReveals();
}

function renderMissing(id){
  $('#stage').innerHTML = `<section style="padding-top:120px"><div class="wrap">
    <div class="beat">Still in production</div>
    <h2>${esc(SLATE[parseInt(String(id).replace('ep',''), 10)] || 'This episode')}</h2>

    <button class="ticket" data-go="ep00">▶ BACK TO ORIENTATION</button>
  </div></section>`;
  wire(null);
}

/* ============================================================
   WIRING
   ============================================================ */
function wire(ep){
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const t = b.dataset.go; if (t) render(t); else openIndex();
  });
  if (!ep) return;

  if (ep.kind === 'orientation') { wireChecklist(ep); return; }

  /* cold open */
  const scene = SCENES[ep.coldOpen.scene];
  if (scene) teardown = scene($('#coldopen'), ep.coldOpen.data) || null;

  /* your move */
  const v = $('.verdict');
  document.querySelectorAll('.choice').forEach(btn => btn.onclick = () => {
    const c = ep.yourMove.choices.find(x => x.id === btn.dataset.v);
    state.choices[ep.id] = c.id;
    document.querySelectorAll('.choice').forEach(b => { b.disabled = true; b.classList.remove('picked-bad','picked-good'); });
    btn.classList.add(c.kind === 'good' ? 'picked-good' : 'picked-bad');
    v.className = 'verdict show ' + c.kind;
    v.querySelector('.tag').textContent = c.verdictTag;
    v.querySelector('.vtext').innerHTML = c.verdict;
  });

  /* lab paths */
  document.querySelectorAll('.pathbtn').forEach(b => b.onclick = () => {
    document.querySelectorAll('.pathbtn').forEach(x => x.setAttribute('aria-selected', x === b));
    document.querySelectorAll('.pathpane').forEach(p => p.classList.toggle('on', p.dataset.pane === b.dataset.path));
  });
}

function wireChecklist(ep){
  const tally = $('.tally'); if (!tally) return;
  const total = +tally.dataset.total, ready = $('.readycard');
  document.querySelectorAll('.check').forEach(c => c.onclick = () => {
    c.classList.toggle('done');
    c.querySelector('.box').textContent = c.classList.contains('done') ? '✓' : '';
    const n = document.querySelectorAll('.check.done').length;
    state.checks[ep.id] = n;
    tally.innerHTML = `<b>${n} / ${total}</b> ready`;
    ready.classList.toggle('show', n === total);
    if (n === total) wire(ep); /* re-bind the unlocked ticket */
  });
}

/* ============================================================
   INDEX / CHROME
   ============================================================ */
function buildIndex(){
  $('#frames').innerHTML = Object.entries(TRACKS).map(([key, tr]) => {
    const nums = []; for (let n = tr.range[0]; n <= tr.range[1]; n++) nums.push(n);
    return `<div class="trackblock">
      <div class="trackhead">${key === 'T0' ? 'Pre-season' : key} · ${esc(tr.name)}</div>
      <div class="tracksub">${esc(tr.sub)}</div>
      <div class="frames">${nums.map(n => {
        const id = 'ep' + String(n).padStart(2, '0'), ep = byId(id);
        const title = ep ? ep.title : (SLATE[n] || '—');
        return `<button class="frame${state.seen[id] ? ' seen' : ''}" data-go="${id}" ${ep ? '' : 'disabled'}>
          <span class="n">EP ${String(n).padStart(2, '0')}</span>
          <span class="t">${esc(title)}</span>
          <span class="s">${ep ? (state.seen[id] ? '✓ watched' : (ep.runtime || 'ready')) : 'in production'}</span>
        </button>`;
      }).join('')}</div>
    </div>`;
  }).join('');
  $('#frames').querySelectorAll('[data-go]').forEach(b =>
    b.onclick = () => { closeIndex(); render(b.dataset.go); });
}
const openIndex  = () => { buildIndex(); $('#index').classList.add('show'); $('#index').setAttribute('aria-hidden','false'); };
const closeIndex = () => { $('#index').classList.remove('show'); $('#index').setAttribute('aria-hidden','true'); };

function observeReveals(){
  if (reduce) return document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), {threshold: .18});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
}

addEventListener('scroll', () => {
  const h = document.documentElement;
  $('#strip').style.width = (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100) + '%';
});

$('#btnIndex').onclick = openIndex;
$('#logo').onclick = openIndex;
$('#btnClose').onclick = closeIndex;
addEventListener('keydown', e => { if (e.key === 'Escape') closeIndex(); });

/* progress: memory + export/import JSON (no localStorage — BLUEPRINT §5) */
$('#btnSave').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'campuscrave-progress.json'; a.click();
  URL.revokeObjectURL(a.href);
};
$('#btnLoad').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { Object.assign(state, JSON.parse(t)); buildIndex(); }).catch(() => alert('That file is not valid progress JSON.'));
};

/* boot */
const start = location.hash.replace('#','') || (EPISODES[0] && EPISODES[0].id);
if (start === 'capstone') render('capstone');
else if (start && byId(start)) render(start);
else { buildIndex(); openIndex(); }
addEventListener('hashchange', () => {
  const id = location.hash.replace('#','');
  if (id === 'capstone') { if (!$('#now').textContent.includes('CAPSTONE')) render(id); return; }
  if (id && byId(id) && (!$('#now').textContent.includes(byId(id).title))) render(id);
});
